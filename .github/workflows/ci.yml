name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, independent checks run as parallel matrix legs so each appears as its
  # own status check with a self-describing name (you can see what failed from
  # the checks list without opening the job). fail-fast:false so every leg
  # reports its result even when a sibling fails. None consume another's output -
  # build is a "does it bundle" gate, not a dependency (the UI tier runs the
  # Vite dev server, not the build).
  check:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Lint (ESLint)
            command: npm run lint
          - label: Type check (tsc)
            command: npm run typecheck
          - label: Unit tests (Vitest)
            command: npm run test:unit
          - label: Build (production bundle)
            command: npm run build
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: ${{ matrix.label }}
        run: ${{ matrix.command }}

  # The Playwright UI tier (headless Chromium against the Vite dev server) is the
  # slowest gate and needs a browser install, so it gets its own job with a
  # larger timeout.
  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests (Playwright project ui)
        run: npx playwright test --project=ui
